name: teramisin
description: "Social workout tracking app for a small private group."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.0.0
  firebase_auth: ^4.0.0
  cloud_firestore: ^4.0.0
  google_sign_in: ^6.0.0

  # Local DB
  sqflite: ^2.3.0
  path: ^1.8.0

  # State management
  flutter_riverpod: ^2.4.0

  # Charts
  fl_chart: ^0.66.0

  # Utilities
  uuid: ^4.0.0
  intl: ^0.18.0
  shared_preferences: ^2.2.0

  # Fonts
  google_fonts: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
